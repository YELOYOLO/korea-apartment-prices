# Supabase CLI config for Mydream (project ref ruyexuwcjilyxvgnxvxt). Defaults for everything else.
project_id = "mydream"

[functions.sync]
# Must stay true: the function trusts the service_role claim only because the gateway verified the JWT.
verify_jwt = true

[functions.map-config]
verify_jwt = false

[functions.geocode]
verify_jwt = true

[functions.ai-search]
verify_jwt = true
